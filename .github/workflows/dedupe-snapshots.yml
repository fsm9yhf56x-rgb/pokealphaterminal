name: dedupe-snapshots
on:
  schedule:
    # 1x/jour a 03:00 UTC (heure creuse, apres les crons prix qui tournent a 15 */4)
    # Garde 1 snapshot/jour par (card_ref, source, variant, condition), supprime les doublons intra-jour
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Dedupe prices_snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="https://kodocards.com/api/cron/dedupe-snapshots?triggeredBy=cron"
          echo "Calling: $URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -n1)
          echo "Response: $BODY"
          echo "HTTP: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "FAILED with HTTP $CODE"
            exit 1
          fi
