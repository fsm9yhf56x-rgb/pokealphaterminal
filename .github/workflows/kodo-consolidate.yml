name: Kodo Engine - Consolidate (merge + signals)
# Fusionne PPT dans price_matrix puis calcule signals + history snapshot.
# CHAINE : part a la FIN du maillon Ed1 FR (lui-meme chaine a FR <- EN/JP).
# La chaine Ed1 eBay a ete sortie d'ici : elle tuait ce workflow par timeout
# deux nuits de suite (45 puis 40 min). Allege, il tient largement en 20 min.
on:
  workflow_run:
    workflows: ["Kodo Engine - Ed1 FR (eBay FR + prix par etat)"]
    types: [completed]
  # CRON DE SECURITE (20/07) : la chaine EN/JP -> FR -> Ed1 -> Consolidate
  # fait 4 maillons et GitHub limite la profondeur des chaines workflow_run
  # -> plus aucun declenchement chaine depuis le 18/07 alors que FR tournait.
  # Si la chaine marche, concurrency deduplique ; sinon ce cron sauve la nuit.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
jobs:
  consolidate:
    name: Merge + signals
    runs-on: ubuntu-latest
    timeout-minutes: 45   # le merge G5/G6 seul prend ~15-20 min ; 20 tuait le job pendant les signaux (runs #29-37)
    concurrency:
      group: kodo-consolidate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: Ensure price_signals schema (print_id, lang)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-migrate-signals-lang.js
      - name: Merge PPT into matrix
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-merge-ppt.js
      - name: Compute signals + history snapshot
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-compute-signals.js
      - name: Generate in-app notifications
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETA_MODE: 'on'
          BETA_ENDS_AT: '2026-08-31T22:00:00Z'
        run: node scripts/generate-notifications.mjs
      # Les 3 steps scan lisaient .env.local en dur : absent sur un runner,
      # donc echec systematique du premier, qui bloquait les deux suivants
      # (pas de `if: always()`). Ils n'ont jamais tourne en CI.
      - name: Pré-entraînement scan (autonome)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-scan-pretrain.mjs
      - name: Indexation visuelle (autonome, lot nocturne)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: BATCH=4000 node scripts/kodo-phash-index.mjs
      - name: Replay des échecs (les ratés deviennent des alias)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-scan-replay.mjs
      # RGPD : la politique de confidentialite annonce 25 mois (CNIL).
      - name: Purge analytics > 25 mois
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/purge-analytics.mjs

      - name: Controle de fraicheur du pipeline
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-health-check.mjs
