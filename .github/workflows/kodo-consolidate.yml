name: Kodo Engine - Consolidate (merge + signals)
# Fusionne PPT dans price_matrix puis calcule signals + history snapshot.
# Tourne APRES les ingests EN/JP (00:10) et FR (00:15), budget 18min chacun.
# 01:00 = marge confortable pour que les deux ingests soient finis.
on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC, apres les ingests
  workflow_dispatch:
jobs:
  consolidate:
    name: Merge + signals
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: kodo-consolidate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Ensure price_signals schema (print_id, lang)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-migrate-signals-lang.js
      - name: Merge PPT into matrix
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-merge-ppt.js
      # Édition 1 / Unlimited FR (eBay FR) : capture + match AVANT le compute,
      # pour que les signals prennent les prix Éd1/Unl (méthode ebay_fr_edition).
      - name: Ingest Éd1 + Unlimited (eBay FR)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: node scripts/ebay-fr-ingest-ed1.mjs --commit
      - name: Match Éd1/Unlimited -> price_matrix
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ebay-fr-match-ed1.mjs --commit
      - name: Prix par état FR (percentiles + ratios)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-price-by-state.mjs --commit
      - name: Compute signals + history snapshot
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-compute-signals.js
      - name: Generate in-app notifications
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/generate-notifications.mjs
      # RGPD : la politique de confidentialite annonce 25 mois (CNIL).
      - name: Purge analytics > 25 mois
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/purge-analytics.mjs
