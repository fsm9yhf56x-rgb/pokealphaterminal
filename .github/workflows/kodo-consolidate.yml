name: Kodo Engine - Consolidate (merge + signals)
# Fusionne PPT dans price_matrix puis calcule signals + history snapshot.
# CHAINE : part a la FIN du maillon Ed1 FR (lui-meme chaine a FR <- EN/JP).
# La chaine Ed1 eBay a ete sortie d'ici : elle tuait ce workflow par timeout
# deux nuits de suite (45 puis 40 min). Allege, il tient largement en 20 min.
on:
  workflow_run:
    workflows: ["Kodo Engine - Ed1 FR (eBay FR + prix par etat)"]
    types: [completed]
  workflow_dispatch:
jobs:
  consolidate:
    name: Merge + signals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kodo-consolidate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: Ensure price_signals schema (print_id, lang)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-migrate-signals-lang.js
      - name: Merge PPT into matrix
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-merge-ppt.js
      - name: Compute signals + history snapshot
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-compute-signals.js
      - name: Generate in-app notifications
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/generate-notifications.mjs
      # RGPD : la politique de confidentialite annonce 25 mois (CNIL).
      - name: Purge analytics > 25 mois
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/purge-analytics.mjs
