name: Kodo Engine - Ingest FR (PokeTrace)
# Ingestion prix FR (Cardmarket EUR) via PokeTrace.
# CHAINE : part a la FIN d'EN/JP (workflow_run = completion, succes OU echec,
# donc tourne meme si l'autre plante). Jamais en parallele avec lui : les crons
# GitHub prennent des heures de retard et les deux runs simultanes se partagent
# les 429 PokeTrace (constate nuit du 16->17 : EN 882/2800 cartes).
# Structure dupliquable pour DE/ES/IT plus tard.
on:
  workflow_run:
    workflows: ["Kodo Engine - Ingest EN/JP (PokeTrace)"]
    types: [completed]
  workflow_dispatch:
jobs:
  ingest-fr:
    name: Ingest FR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: kodo-ingest-fr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: Ingest FR batch (Cardmarket EUR)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
          KODO_MAX_REQ: '5500'
          KODO_MAINT_REQ: '2500'   # Tier 1 FR = 2225 cartes -> couvert chaque nuit
        run: node scripts/kodo-ingest-eu-lang.js fr
