name: kodo-sealed

# Scelle FR + EN : decouverte + cote depuis les annonces eBay FR, puis retypage et
# peremption. Cron PROPRE (pas de workflow_run) : la chaine nocturne casse deja
# au 4e maillon et le scelle FR n'a aucune dependance vers les autres ingests.
#
# 07:30 UTC : le quota eBay se remet a zero a 07:00 UTC (verifie via getRateLimits).
# Tourner avant, c'est consommer le reliquat de la veille. Et apres le scelle
# EN/JP (03:00), le graded FR (03:30), le catalogue (04:00 lundi), la pop PSA (05:00).
#
# Quota : ~175 series x 4 requetes = 700 appels eBay Browse, tres loin du plafond.
# Ne consomme AUCUN credit PokeTrace ni PPT.

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      sets:
        description: 'Series a cibler (csv, vide = toutes)'
        required: false
        default: ''

concurrency:
  group: kodo-sealed
  cancel-in-progress: false

jobs:
  sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # npm install et non npm ci : le lock omet les deps @emnapi/* de sharp sur
      # macOS-arm64 alors que linux-x64 les reclame (panne CI du 13/07).
      - run: npm install

      - name: Quota eBay avant
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: node scripts/ebay-quota.mjs --label "avant scelle"

      - name: Ingest scelle FR (eBay)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          KODO_SEALED_SETS: ${{ github.event.inputs.sets }}
        run: node scripts/kodo-ingest-sealed-fr.mjs --commit

      - name: Quota eBay apres FR
        if: always()
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: node scripts/ebay-quota.mjs --label "apres FR"

      - name: Decouverte scelle EN (eBay US)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          KODO_SEALED_SETS: ${{ github.event.inputs.sets }}
        run: node scripts/kodo-ingest-sealed-en.mjs --commit

      - name: Quota eBay apres EN
        if: always()
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: node scripts/ebay-quota.mjs --label "apres EN"

      # Un produit qu'aucune journee isolee ne valide peut l'etre sur 90 jours : un
      # display Set de Base 1ere edition passe une fois par mois. Le seuil de 3
      # vendeurs ne bouge pas, seule sa fenetre change.
      - name: Promotion depuis la fenetre 90 jours
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-sealed-promote.mjs --commit

      # Idempotent et gratuit : rattrape d'eventuels SKU herites du fournisseur.
      - name: Retypage depuis les noms
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node scripts/kodo-sealed-normalize.mjs --lang fr --commit
          node scripts/kodo-sealed-normalize.mjs --lang en --commit

      # PLUS DE PEREMPTION DESTRUCTRICE (decision 29/07) : un produit disparu des
      # annonces GARDE son prix et sa date. L'affichage le signale comme ancien ;
      # il redevient courant des qu'une annonce similaire revient. Effacer
      # laisserait le vintage vide onze mois sur douze.
      - name: Etat des cotes (observation)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-sealed-expire.mjs --check
