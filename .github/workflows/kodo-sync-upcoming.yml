name: Kodo Engine - Sync Upcoming (Bulbapedia)
# Rafraichit upcoming_sets. Le cron de secours rend le job independant de la
# cascade workflow_run et le job ne met plus toute la CI en rouge lorsqu'une
# source externe est temporairement indisponible ou change de structure.
on:
  workflow_run:
    workflows: ["Kodo Engine - Ingest EN/JP (PokeTrace)"]
    types: [completed]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:
jobs:
  sync-upcoming:
    name: Sync upcoming sets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: kodo-sync-upcoming
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: Sync upcoming_sets depuis Bulbapedia
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-upcoming.mjs --commit
