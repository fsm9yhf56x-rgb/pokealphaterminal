name: Vérification proposition web
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/benchmark-scan-visual.mjs'
      - '.github/workflows/pr-typecheck.yml'
concurrency:
  group: web-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Benchmark scanner visuel
        run: node scripts/benchmark-scan-visual.mjs
      - name: Publier le rapport scanner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-visual-benchmark
          path: artifacts/scan-visual-benchmark.json
          if-no-files-found: ignore
