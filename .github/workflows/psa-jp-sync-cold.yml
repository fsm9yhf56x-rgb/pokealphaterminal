name: PSA JP Sync COLD (monthly, manual)

on:
  schedule:
    - cron: '0 3 18 * *'  # 18 du mois 3h UTC (JP tier cold)
  workflow_dispatch:

# 471 sets COLD JP cannot fit in GitHub Actions 6h timeout.
# We use matrix strategy to parallelize: split into 4 chunks of ~118 sets each.
# Each chunk has its own runner, and they run in parallel.

permissions:
  contents: write

jobs:
  scrape-cold-jp:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~6h max
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]   # 4 parallel chunks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run PSA JP scraper (cold tier, chunk ${{ matrix.chunk }} of 4)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_TOTAL: 4
        run: npm run psa:scrape:jp:cold

      - name: Rebuild static JSON
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/rebuild-static-data.mjs

      - name: Auto-commit JSON updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-rebuild after PSA sync $(date +%Y-%m-%d)" && git push)
