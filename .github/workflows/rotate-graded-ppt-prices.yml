name: Rotate Graded PPT prices (maintenance)
# Entretien continu EN + JP. Deux rotations/jour + concurrence unique.
# IMPORTANT : une ligne sync_progress absente n'est plus interpretee comme
# 'autorisee' silencieusement : on lance la rotation, qui est resumable.
on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Sets a retraiter par run (default 20)'
        default: '20'
        required: false
jobs:
  rotate:
    name: Rotate graded prices (oldest first)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: rotate-graded-ppt-prices
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --prefer-offline
      - name: Run rotation batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKEMON_PRICE_TRACKER_API_KEY: ${{ secrets.POKEMON_PRICE_TRACKER_API_KEY }}
        run: |
          node scripts/sync-graded-ppt.js \
            --rotate \
            --batch-size ${{ github.event.inputs.batch_size || '20' }}
