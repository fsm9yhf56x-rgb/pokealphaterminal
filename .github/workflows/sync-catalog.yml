name: Sync Catalog (TCGdex → R2 + DB)
on:
  schedule:
    - cron: '0 4 * * 1'   # tous les lundis 04h UTC (hebdo, sync nouveaux sets)
  workflow_dispatch:
    inputs:
      lang:
        description: 'Langue à synchroniser (en, fr, ou vide = les deux)'
        required: false
        default: ''
        type: string
      set:
        description: 'Set spécifique (ex: en-base1)'
        required: false
        default: ''
        type: string
      dry:
        description: 'Dry run (simulation)'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
# Empeche deux runs concurrents (cron + dispatch) de se pousser dessus
concurrency:
  group: sync-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps
        run: npm install
      - name: Run sync-catalog
        run: |
          ARGS="--trigger=cron"
          if [ -n "${{ inputs.lang }}" ]; then ARGS="$ARGS --lang=${{ inputs.lang }}"; fi
          if [ -n "${{ inputs.set }}" ]; then ARGS="$ARGS --set=${{ inputs.set }}"; fi
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          echo "Running: node scripts/sync-catalog.js $ARGS"
          node scripts/sync-catalog.js $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: pokealphaterminal-images
      - name: Propagate to Kodo Engine (tcg_* -> k_*)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-sync-catalog.js
      - name: Refresh Kodo export views
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/kodo-create-export-views.js
      - name: Match PSA JP population
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/match-psa-jp-pop.mjs
      - name: Rebuild static JSON
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/rebuild-static-data.mjs
      - name: Write data version (hash de contenu, invalide le cache client)
        run: node scripts/write-data-version.mjs
      - name: Auto-commit JSON updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --staged --quiet; then
            echo "Aucun changement JSON, rien a committer."
            exit 0
          fi
          git commit -m "chore(data): auto-rebuild catalog $(date +%Y-%m-%d)"
          # Nos JSON sont generes depuis la DB = source de verite.
          # En cas de push concurrent : on ne merge JAMAIS (conflits garantis sur
          # fichiers generes). On se recale dur sur origin/main et on rejoue nos JSON.
          OURS=$(git rev-parse HEAD)
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK (tentative $i)."
              exit 0
            fi
            echo "Push rejete (tentative $i), recalage dur sur origin/main..."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            git checkout "$OURS" -- 'public/data/*.json'
            git add public/data/*.json
            if git diff --staged --quiet; then
              echo "Nos JSON sont deja a jour sur le remote, rien a pousser."
              exit 0
            fi
            git commit -m "chore(data): auto-rebuild catalog $(date +%Y-%m-%d)"
            sleep 3
          done
          echo "::error::Push echoue apres 5 tentatives."
          exit 1
