name: Sync JP PPT (referentiel + images)
# Importe le referentiel JP depuis PPT (cartes + images R2) en mode resume.
# Tourne chaque nuit a 00h15 UTC (apres reset quota PPT, decale de l'EN a 00h05).
# --resume skip les sets deja en base -> couvre les 442 sets en ~2-3 jours.
# --max-credits 16000 = arret propre sous le quota 20k/j.
on:
  schedule:
    - cron: '15 0 * * *'   # 00:15 UTC quotidien (apres l'EN a 00:05)
  workflow_dispatch:
    inputs:
      max_credits:
        description: 'Plafond credits (default 16000)'
        default: '16000'
        required: false
jobs:
  import-jp:
    name: Import referentiel JP depuis PPT
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: sync-jp-ppt
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Import JP batch (resume)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKEMON_PRICE_TRACKER_API_KEY: ${{ secrets.POKEMON_PRICE_TRACKER_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          node scripts/import-jp-ppt.js --all --resume --max-credits ${{ github.event.inputs.max_credits || '16000' }} --max-sets 25
      - name: Progress summary
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
            const { neon } = require('@neondatabase/serverless');
            const sql = neon(process.env.DATABASE_URL);
            (async () => {
              const r = await sql\`SELECT COUNT(DISTINCT set_id)::int AS sets, COUNT(*)::int AS cartes FROM tcg_cards WHERE source='ppt' AND lang='JP'\`;
              console.log('JP PPT: ' + r[0].sets + ' sets, ' + r[0].cartes + ' cartes');
            })();
          "
