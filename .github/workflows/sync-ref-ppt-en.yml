name: Sync EN PPT (referentiel + images)
# Importe le referentiel EN depuis PPT (cartes + images R2) en mode resume.
# Cron DESACTIVE au depart (commente) : activer seulement quand le JP est fini,
# pour ne pas saturer le quota PPT 20k/j partage entre JP/EN/graded.
# --resume skip les sets deja en base -> couvre les ~217 sets EN en ~3-4 jours.
# --max-credits 16000 = arret propre sous le quota 20k/j.
on:
  # schedule:
  #   - cron: '30 4 * * *'    # 04:30 UTC
  #   - cron: '30 12 * * *'   # 12:30 UTC
  #   - cron: '30 20 * * *'   # 20:30 UTC
  workflow_dispatch:
    inputs:
      max_credits:
        description: 'Plafond credits par run (default 12000)'
        default: '12000'
        required: false
jobs:
  import-en:
    name: Import referentiel EN depuis PPT
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: sync-en-ppt
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Import EN batch (resume)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKEMON_PRICE_TRACKER_API_KEY: ${{ secrets.POKEMON_PRICE_TRACKER_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          node scripts/import-en-ppt.js --all --resume --max-credits ${{ github.event.inputs.max_credits || '12000' }} --max-sets 60
      - name: Progress summary
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
            const { neon } = require('@neondatabase/serverless');
            const sql = neon(process.env.DATABASE_URL);
            (async () => {
              const r = await sql\`SELECT COUNT(DISTINCT set_id)::int AS sets, COUNT(*)::int AS cartes FROM tcg_cards WHERE source='ppt' AND lang='EN'\`;
              console.log('EN PPT: ' + r[0].sets + ' sets, ' + r[0].cartes + ' cartes');
            })();
          "
